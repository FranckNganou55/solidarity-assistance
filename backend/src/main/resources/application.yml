server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: solidarite-api
  profiles:
    default: demo
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:makenene-solidarite-secret-key-change-me-in-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  default-password: ${DEFAULT_PASSWORD:Mak2026}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
