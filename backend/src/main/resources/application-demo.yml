# Profil DEMO : base H2 en memoire (PostgreSQL mode) pour lancer l'app sans installer Postgres
spring:
  datasource:
    url: jdbc:h2:mem:solidarite;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  seed-demo-data: true
