# Profil POSTGRES : base de donnees de production
# Lancer avec : -Dspring.profiles.active=postgres
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/makenene_solidarite}
    username: ${DB_USER:solidarite}
    password: ${DB_PASSWORD:solidarite}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
