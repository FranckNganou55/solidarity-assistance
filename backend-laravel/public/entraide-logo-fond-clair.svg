<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" role="img" aria-label="Entraide – gestion des assistances et solidarités">
  <defs>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Icône : trois personnes qui forment un cercle autour d'un cœur -->
  <g transform="translate(10,10)">
    <g fill="none" stroke-width="9" stroke-linecap="round">
      <g stroke="#0D9488">
        <path d="M70.35 21.36 A40 40 0 0 1 100 60"/>
        <circle cx="54.43" cy="20.39" r="6.5" fill="#0D9488" stroke="none"/>
      </g>
      <g stroke="#2563EB" transform="rotate(120 60 60)">
        <path d="M70.35 21.36 A40 40 0 0 1 100 60"/>
        <circle cx="54.43" cy="20.39" r="6.5" fill="#2563EB" stroke="none"/>
      </g>
      <g stroke="#F59E0B" transform="rotate(240 60 60)">
        <path d="M70.35 21.36 A40 40 0 0 1 100 60"/>
        <circle cx="54.43" cy="20.39" r="6.5" fill="#F59E0B" stroke="none"/>
      </g>
    </g>
    <path transform="translate(44.4,44.6) scale(1.3)" fill="url(#heart)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </g>

  <!-- Nom et signature -->
  <text x="150" y="80" font-family="Poppins, Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#1E6F5C">Entraide</text>
  <text x="153" y="112" font-family="Poppins, Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#667085">ASSISTANCES &amp; SOLIDARITÉS</text>
</svg>


